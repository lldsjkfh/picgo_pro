<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1330" width="1400" height="1330" font-family="'Microsoft YaHei','PingFang SC',system-ui,sans-serif" role="img">
<title>App 侧巡检任务状态机迁移图（第三轮 v0.3）</title>
<desc>表达 App 侧巡检任务从准备、起飞前自检、起飞倒计时、执行、返航到已落地／已中断的业务状态与迁移条件；区分请求发出与机载执行，区分停障恢复／自动返航／任务中断，补正常完成线，断开连接不等于任务结束，落地不等于成果处理完成。</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar-g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3B6D11" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#854F0B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar-q" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="1400" height="1330" fill="#FFFFFF"/>
<text x="44" y="46" font-size="21" font-weight="700" fill="#0F172A">App 侧巡检任务状态机迁移图（第三轮 v0.3）</text>
<text x="44" y="74" font-size="13" fill="#64748B">围绕一次巡检的准备 → 起飞前自检 → 起飞倒计时 → 执行 → 返航 → 已落地／已中断。箭头为触发事件与条件；机载系统在边界外，本图只表达 App 业务状态与机载反馈。</text>

<rect x="44" y="90" width="18" height="15" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="68" y="103" font-size="12.5" fill="#334155">App 业务状态</text>
<rect x="182" y="90" width="18" height="15" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.7" stroke-dasharray="4 2.5"/>
<text x="206" y="103" font-size="12.5" fill="#334155">机载反馈（App 只展示）</text>
<rect x="386" y="90" width="18" height="15" rx="3" fill="#FFFFFF" stroke="#475569" stroke-width="1.6"/>
<text x="410" y="103" font-size="12.5" fill="#334155">过渡态：请求已发出（待机载确认）</text>
<rect x="636" y="90" width="18" height="15" rx="7" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<text x="660" y="103" font-size="12.5" fill="#334155">终态</text>

<line x1="44" y1="128" x2="200" y2="128" stroke="#3B6D11" stroke-width="1.6"/>
<text x="212" y="132" font-size="12.5" fill="#334155">正常／停障恢复</text>
<line x1="336" y1="128" x2="492" y2="128" stroke="#854F0B" stroke-width="1.6"/>
<text x="504" y="132" font-size="12.5" fill="#334155">自动返航／立即返航</text>
<line x1="632" y1="128" x2="788" y2="128" stroke="#A32D2D" stroke-width="1.6"/>
<text x="800" y="132" font-size="12.5" fill="#334155">任务中断</text>
<line x1="888" y1="128" x2="1044" y2="128" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="5 3"/>
<text x="1056" y="132" font-size="12.5" fill="#334155">待确认（需求未明确）</text>
<line x1="44" y1="148" x2="1356" y2="148" stroke="#E2E8F0" stroke-width="1"/>

<text x="44" y="182" font-size="13.5" font-weight="700" fill="#0F172A">一、准备：两条并列的起飞前置条件</text>
<circle cx="64" cy="250" r="12" fill="#0F172A"/>
<rect x="96" y="222" width="152" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="172" y="242" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">初始（未就绪）</text>
<text x="172" y="262" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">未连接、未选场景／航线</text>
<path d="M76 250 L96 250" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>

<rect x="286" y="200" width="330" height="140" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="298" y="222" font-size="12.5" font-weight="700" fill="#475569">准备（两条前置并列，无先后）</text>
<rect x="300" y="234" width="302" height="42" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="310" y="255" font-size="12" fill="#0C447C" dominant-baseline="middle">① 设备连接：未连接 →（连接中）→ 已连接</text>
<rect x="300" y="284" width="302" height="42" rx="7" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="310" y="305" font-size="12" fill="#0C447C" dominant-baseline="middle">② 场景／航线：未选 → 已选场景 → 已选航线</text>
<rect x="676" y="228" width="210" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="781" y="251" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">待起飞</text>
<text x="781" y="271" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">两条件齐备，可一键启动</text>
<path d="M248 250 L286 250" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="267" y="240" font-size="11" fill="#475569" text-anchor="middle">进入准备</text>
<path d="M616 270 L676 262" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="646" y="242" font-size="11" fill="#475569" text-anchor="middle">①已连接 ∧</text>
<text x="646" y="256" font-size="11" fill="#475569" text-anchor="middle">②已选场景·航线</text>
<path d="M781 228 L781 178 L451 178 L451 200" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-q)"/>
<text x="614" y="172" font-size="11" fill="#64748B" text-anchor="middle">断开连接／改选：条件不再齐备，按钮置灰并引导</text>

<text x="44" y="380" font-size="13.5" font-weight="700" fill="#0F172A">二、起飞前自检与人工确认</text>
<rect x="640" y="404" width="232" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="756" y="427" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">起飞前自检</text>
<text x="756" y="447" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">已下发启动请求，等待整包回传</text>
<path d="M756 292 L756 404" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="768" y="340" font-size="11.5" fill="#475569">一键启动（下发启动／自检请求）</text>
<rect x="930" y="494" width="236" height="54" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.8"/>
<text x="1048" y="513" font-size="13" font-weight="700" fill="#791F1F" text-anchor="middle" dominant-baseline="middle">自检未通过</text>
<text x="1048" y="532" font-size="11.5" fill="#A32D2D" text-anchor="middle" dominant-baseline="middle">阻止起飞，可重新自检</text>
<rect x="640" y="522" width="232" height="58" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="756" y="543" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">待起飞确认</text>
<text x="756" y="562" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">人工确认场景／航线匹配（App 提示）</text>
<path d="M756 468 L756 522" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#ar-g)"/>
<text x="766" y="487" font-size="10.5" fill="#3B6D11">机载自检整包回传</text>
<text x="766" y="503" font-size="10.5" fill="#3B6D11">→ 通过</text>
<path d="M872 440 L905 440 L905 521 L930 521" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar-r)"/>
<text x="928" y="438" font-size="10.5" fill="#A32D2D">机载自检整包回传 → 失败＋原因</text>
<path d="M1166 540 L1185 540 L1185 376 L690 376 L690 404" fill="none" stroke="#3B6D11" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-g)"/>
<text x="872" y="368" font-size="11" fill="#3B6D11" text-anchor="middle">重新自检（上限待确认）</text>
<rect x="1196" y="600" width="160" height="144" rx="8" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1" stroke-dasharray="6 4"/>
<text x="1276" y="620" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">待确认</text>
<text x="1206" y="642" font-size="11" fill="#64748B">自检超时阈值</text>
<text x="1206" y="660" font-size="11" fill="#64748B">重检次数上限</text>
<text x="1206" y="678" font-size="11" fill="#64748B">控制确认口径 SCI-Q07</text>
<text x="1206" y="696" font-size="11" fill="#64748B">连接超时 SCI-Q12</text>
<text x="1206" y="714" font-size="11" fill="#64748B">权限拒绝 SCI-Q10</text>
<text x="1206" y="732" font-size="11" fill="#64748B">失败重试 SCI-Q11</text>

<text x="44" y="616" font-size="13.5" font-weight="700" fill="#0F172A">三、起飞倒计时、执行与机载分支</text>
<rect x="640" y="640" width="232" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="756" y="660" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">起飞倒计时</text>
<text x="756" y="679" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">可取消起飞（二次确认）</text>
<path d="M756 580 L756 640" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#ar-g)"/>
<text x="768" y="612" font-size="11.5" fill="#3B6D11">人工确认匹配</text>
<rect x="936" y="640" width="204" height="56" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.7"/>
<rect x="941" y="645" width="194" height="46" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="1038" y="659" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="middle">起飞请求已发出</text>
<text x="1038" y="678" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="middle">待机载确认</text>
<path d="M872 668 L936 668" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="904" y="658" font-size="10.5" fill="#475569" text-anchor="middle">倒计时结束</text>
<path d="M640 690 L630 690 L630 276 L676 276" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-q)"/>
<text x="624" y="500" font-size="11" fill="#64748B" text-anchor="end">取消起飞（二次确认）→ 回到待起飞</text>
<rect x="612" y="732" width="286" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="755" y="755" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">执行中（按航线自动巡检）</text>
<text x="755" y="775" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">巡检任务执行中禁止切换设备</text>
<path d="M1040 696 L1040 716 L898 716 L898 732" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-q)"/>
<text x="964" y="710" font-size="10.5" fill="#64748B" text-anchor="middle">机载回报已起飞（请求≠已执行）</text>
<rect x="952" y="732" width="204" height="54" rx="8" fill="#FFFFFF" stroke="#475569" stroke-width="1.7"/>
<rect x="957" y="737" width="194" height="44" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="1054" y="751" font-size="13" font-weight="700" fill="#334155" text-anchor="middle" dominant-baseline="middle">返航请求已发出</text>
<text x="1054" y="770" font-size="11" fill="#64748B" text-anchor="middle" dominant-baseline="middle">待机载确认</text>
<path d="M898 762 L952 759" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="925" y="750" font-size="10.5" fill="#475569" text-anchor="middle">长按确认返航</text>

<path d="M680 796 L680 1034" fill="none" stroke="#3B6D11" stroke-width="1.8" marker-end="url(#ar-g)"/>
<text x="692" y="898" font-size="11" fill="#3B6D11">［航线执行完成］</text>

<rect x="420" y="832" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="510" y="854" font-size="12.5" font-weight="700" fill="#633806" text-anchor="middle" dominant-baseline="middle">停障悬停（机载）</text>
<rect x="420" y="892" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="510" y="914" font-size="12.5" font-weight="700" fill="#633806" text-anchor="middle" dominant-baseline="middle">航路恢复过渡（机载）</text>
<rect x="700" y="832" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="790" y="854" font-size="12.5" font-weight="700" fill="#633806" text-anchor="middle" dominant-baseline="middle">自动返航（机载）</text>
<rect x="150" y="832" width="180" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/>
<text x="240" y="854" font-size="12.5" font-weight="700" fill="#633806" text-anchor="middle" dominant-baseline="middle">原地迫降（机载）</text>
<path d="M612 752 L566 752 L566 828" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar-a)"/>
<text x="556" y="748" font-size="10.5" fill="#854F0B" text-anchor="end">自动停障</text>
<path d="M510 876 L510 892" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#ar-g)"/>
<text x="520" y="888" font-size="10.5" fill="#3B6D11">障碍解除</text>
<path d="M600 914 L650 914 L650 796" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#ar-g)"/>
<text x="650" y="932" font-size="10.5" fill="#3B6D11" text-anchor="middle">过渡结束自动续飞</text>
<path d="M600 854 L700 854" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar-a)"/>
<text x="650" y="845" font-size="10" fill="#854F0B" text-anchor="middle">停障超时</text>
<path d="M790 796 L790 832" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar-a)"/>
<text x="798" y="818" font-size="10.5" fill="#854F0B">电量≤12%</text>
<path d="M420 862 L340 862 L340 1015 L620 1015 L620 1034" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar-a)"/>
<text x="480" y="1008" font-size="10.5" fill="#854F0B" text-anchor="middle">长按立即返航</text>
<path d="M612 780 L300 780 L300 832" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar-r)"/>
<text x="456" y="771" font-size="10.5" fill="#A32D2D" text-anchor="middle">定位丢失（不返航·原地降落）</text>
<path d="M240 876 L240 904" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar-r)"/>
<rect x="150" y="904" width="180" height="52" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<rect x="155" y="909" width="170" height="42" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="240" y="923" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="middle">已中断</text>
<text x="240" y="941" font-size="10.5" fill="#334155" text-anchor="middle" dominant-baseline="middle">已飞数据保留，部分结果</text>
<path d="M612 792 L360 792 L360 930 L330 930" fill="none" stroke="#A32D2D" stroke-width="1.6" marker-end="url(#ar-r)"/>
<text x="500" y="806" font-size="10.5" fill="#A32D2D" text-anchor="middle">遥控器介入</text>

<text x="44" y="1010" font-size="13.5" font-weight="700" fill="#0F172A">四、返航与终态</text>
<rect x="600" y="1034" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.7"/>
<text x="730" y="1055" font-size="14" font-weight="700" fill="#0C447C" text-anchor="middle" dominant-baseline="middle">返航中（沿原航线回溯）</text>
<text x="730" y="1074" font-size="11.5" fill="#185FA5" text-anchor="middle" dominant-baseline="middle">巡检任务执行中禁止切换设备</text>
<path d="M790 876 L790 1034" fill="none" stroke="#854F0B" stroke-width="1.6" marker-end="url(#ar-a)"/>
<text x="802" y="960" font-size="10.5" fill="#854F0B">自动返航</text>
<path d="M1054 786 L1054 1052 L860 1052" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#ar-q)"/>
<text x="1064" y="900" font-size="10.5" fill="#64748B">机载回报返航执行</text>
<text x="1064" y="916" font-size="10.5" fill="#64748B">（请求≠已执行）</text>
<rect x="280" y="1034" width="240" height="56" rx="8" fill="#F1F5F9" stroke="#475569" stroke-width="1"/>
<rect x="285" y="1039" width="230" height="46" rx="6" fill="none" stroke="#B4B2A9" stroke-width="0.7"/>
<text x="400" y="1055" font-size="13.5" font-weight="700" fill="#0F172A" text-anchor="middle" dominant-baseline="middle">已落地（巡检完成／未完整）</text>
<text x="400" y="1074" font-size="11" fill="#334155" text-anchor="middle" dominant-baseline="middle">一次飞行执行结束</text>
<path d="M600 1062 L520 1062" fill="none" stroke="#3B6D11" stroke-width="1.6" marker-end="url(#ar-g)"/>
<text x="560" y="1052" font-size="10.5" fill="#3B6D11" text-anchor="middle">机载回报已落地</text>

<text x="604" y="1120" font-size="11.5" fill="#64748B">批注（不属本图，仅说明衔接）：成果处理由机载按「数据回传／点云处理／结果计算」三环节进行；</text>
<text x="604" y="1142" font-size="11.5" fill="#64748B">「查看结果」以机载处理完成为准（需求 §4.2），故落地不等于可查看成果，成果处理见 2.0／3.0。</text>

<text x="44" y="1210" font-size="11.5" fill="#475569">注 1：请求发出 ≠ 机载已执行（起飞、返航均先落到「请求已发出（待机载确认）」再进入执行态）。</text>
<text x="44" y="1232" font-size="11.5" fill="#475569">注 2：巡检任务执行中禁止切换设备；断开连接 ≠ 任务结束——不进入终态，可重连后继续接收机载状态。</text>
<text x="44" y="1254" font-size="11.5" fill="#475569">注 3：正常完成线为「航线执行完成」→ 返航中；异常返航为「停障超时／电量≤12%」自动返航，另有停障期间「长按立即返航」。</text>
